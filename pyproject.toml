[project]
name = "kolmogorov-decomposition"
version = "0.1.0"
description = "Experiments in computational codebooks and procedural neural network weights"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=2.0",
]

[project.optional-dependencies]
model = [
    "accelerate>=1.6",
    "pyarrow>=18",
    "safetensors>=0.4",
    "scipy>=1.14",
    "tokenizers>=0.21",
    "torch>=2.6",
    "transformers>=4.50,<6",
]

[tool.uv]
package = false
